function auth(mode='login',msg='',v={}){
 const L=mode=='login',val=(i,x)=>`value="${esc(x||'')}"`;
 const fields=`<input id="u" placeholder="Username" autocomplete="username" ${val('u',v.u)}>${L?'':`<input id="e" type="email" placeholder="Email address" autocomplete="email" ${val('e',v.e)}><input id="ph" type="tel" placeholder="Contact number, e.g. +919876543210" autocomplete="tel" ${val('ph',v.ph)}>`}<input id="p" type="password" placeholder="Password (min 6 characters)" autocomplete="${L?'current-password':'new-password'}"><div class="err">${msg}</div><button class="pri" id="go">${L?'Log in':'Sign up'}</button><button class="lnk" id="sw" type="button">${L?'Need an account? Sign up':'Have an account? Log in'}</button>`;
 $.innerHTML=L?`<div style="text-align:center"><h1>🧠 DevOps Interview <span class="g">Quiz</span></h1><p class="s" style="margin-bottom:6px">Fill the bottle to log in 🍾</p></div>${BOTTLE}<div class="card pop">${fields}</div>`
 :`<div class="room${v.on?' on':''}" id="room"><div class="cone"></div>${LAMP}<p class="hint" id="ht">${v.on?'Lights on! Create your account ✨':'Pull the lamp cord to switch on the light 💡'}</p><div class="card" id="fc">${fields}</div></div>`;

async function exportXl(){
 try{
  if(!DB||!(await isOwn()))return toast('Only the owner can export');

  const rows=a.docs.map(d=>{const x=d.data();return{Username:x.username,Email:x.email,Phone:x.phone,Joined:x.joined,'Best Points':B[x.username]||0}});
  if(!rows.length)return toast('No signups yet');
  const dl=await claude.use('downloads');if(!dl)return toast('Downloads unavailable in this view');
  try{if(!window.XLSX)throw 0;const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();ws['!cols']=[{wch:16},{wch:30},{wch:16},{wch:12},{wch:12}];XLSX.utils.book_append_sheet(wb,ws,'Users');
   await dl.save({filename:'quiz-users.xlsx',data:XLSX.write(wb,{type:'array',bookType:'xlsx'})});toast('📥 Excel ready: '+rows.length+' users')}
  catch(e){if(e&&e.code=='declined')return;
   const f=v=>'"'+String(/^[=+\-@]/.test(v)&&!/^\+\d+$/.test(v)?"'"+v:v).replace(/"/g,'""')+'"',k=Object.keys(rows[0]);
   await dl.save({filename:'quiz-users.csv',data:[k.map(f).join(','),...rows.map(r=>k.map(c=>f(r[c])).join(','))].join('\n')});toast('📥 CSV saved: '+rows.length+' users')}
 }catch(e){toast('Export failed or cancelled')}

let DB=null,UR=null,DBP=Promise.resolve(null),URP=Promise.resolve(null);
try{if(window.claude){DBP=claude.use('db').then(d=>DB=d).catch(()=>null);URP=claude.use('user').then(u=>{UR=u;ownerBtn();return u}).catch(()=>null)}}catch(e){}
let OWN=false;
async function isOwn(){if(OWN)return true;try{await Promise.all([DBP,URP])}catch(e){}
 try{if(UR&&UR.isOwner())return OWN=true}catch(e){}
 try{if(DB){await DB.collection('signups').limit(1).get();return OWN=true}}catch(e){}
 return false}
async function ownerBtn(){try{if(!document.getElementById('exw')||!(await isOwn()))return;const w=document.getElementById('exw');if(w&&!w.firstChild){w.innerHTML='<button class="lnk" id="ex">📥 Excel (owner)</button>';document.getElementById('ex').onclick=exportXl}}catch(e){}}
try{Promise.all([DBP,URP]).then(()=>ownerBtn())}catch(e){}
async function regRemote(n,e,ph){try{await Promise.all([DBP,URP]);if(!DB||!UR)return false;const id=await UR.id();await DB.collection('signups').doc(String(id)).set({username:n,email:e,phone:ph,joined:new Date().toISOString().slice(0,10),ts:Date.now()});return true}catch(x){return false}}
function lbLocal(){try{return JSON.parse(localStorage.getItem('q_lb')||'{}')}catch(e){return{}}}
async function lbSave(){
 const r={name:U,pts:S.pts,sc:S.sc,k:S.k,ts:Date.now()};
 const l=lbLocal();if(!l[U]||l[U].pts<r.pts){l[U]=r;try{localStorage.setItem('q_lb',JSON.stringify(l))}catch(e){}}
 if(DB)try{const d=DB.collection('scores').doc(U),o=await d.get();if(!o.exists||o.data().pts<r.pts)await d.set(r)}catch(e){}
}
async function lbShow(){
 $.innerHTML=`<div class="top"><button class="lnk" id="bk">← Back</button></div><h1>🏆 <span class="g">Leaderboard</span></h1><p class="s" id="ls">Loading top 10…</p><div id="ll"></div>`;
 document.getElementById('bk').onclick=home;
 let rows=null,g=false;
 if(DB)try{const q=await DB.collection('scores').orderBy('pts','desc').limit(10).get();rows=q.docs.map(d=>d.data());g=true}catch(e){}
 if(!rows)rows=Object.values(lbLocal()).sort((a,b)=>b.pts-a.pts).slice(0,10);
 document.getElementById('ls').textContent=(g?'🌍 Global top 10':'📱 Top 10 on this device')+' · best round score per player';
 document.getElementById('ll').innerHTML=rows.length?rows.map((r,i)=>`<div class="lb${r.name==U?' me':''}" style="animation-delay:${i*.05}s"><span class="rk">${['🥇','🥈','🥉'][i]||i+1}</span><span class="nm">${esc(String(r.name))}<br><small>${esc(String(r.k))} · ${+r.sc}/10 correct</small></span><span class="pt">⭐ ${+r.pts}</span></div>`).join(''):'<div class="card">No scores yet. Play a round to get on the board! 🚀</div>';
}
const META={AWS:['☁️','#f59e0b','#ef4444'],Linux:['🐧','#10b981','#06b6d4'],Networking:['🌐','#3b82f6','#8b5cf6'],DevOps:['🚀','#8b5cf6','#ec4899'],Mixed:['🎲','#ec4899','#f59e0b']};
let T;
function home(){
 if(!U)return auth();
 clearInterval(T);const all=Object.values(D).flat();
 $.innerHTML=`<div class="top"><span class="chip">👋 ${esc(U)}</span><span><button class="lnk" id="lb">🏆 Leaderboard</button><span id="exw"></span><button class="lnk" id="lo">Log out</button></span></div><h1>DevOps Interview <span class="g">Quiz</span></h1><p class="s">Beat the clock, build streaks, ace your interview.</p><div class="grid">`+
 [...Object.keys(D),'Mixed'].map(k=>{const m=META[k],n=(k=='Mixed'?all:D[k]).length,b=best(k);return `<button class="cat" data-k="${k}" style="--c1:${m[1]};--c2:${m[2]}"><em>${m[0]}</em><b>${k}</b><span>${n} questions · 15s each</span>${b?`<i>🏆 ${b}/10</i>`:''}</button>`}).join('')+`</div>`;
 $.querySelectorAll('.cat').forEach(b=>b.onclick=()=>start(b.dataset.k));
 document.getElementById('lo').onclick=logout;document.getElementById('lb').onclick=lbShow;ownerBtn();
}
function start(k){
 const pool=k=='Mixed'?Object.keys(D).flatMap(c=>D[c].map(x=>[...x,c])):D[k].map(x=>[...x,k]);
 const qs=sh(pool).slice(0,10).map(([q,a,c])=>{
  const w=sh(D[c].filter(x=>x[1]!==a)).slice(0,3).map(x=>x[1]);
  return{q,a,c,o:sh([a,...w])}});
 S={k,qs,i:0,sc:0,st:0,pts:0,miss:[]};show();
}
function show(){
 clearInterval(T);
 const x=S.qs[S.i],p=S.i/S.qs.length*100;S.t=15;
 $.innerHTML=`<div class="bar"><i style="width:${p}%"></i></div><div class="row"><span class="chip">${META[S.k][0]} ${S.k} · ${S.i+1}/${S.qs.length}</span><span class="chip">🔥 ${S.st} · ⭐ ${S.pts}</span></div><div class="tm"><i id="tb"></i></div>
 <div class="card pop" id="qc"><h2>${esc(x.q)}</h2>${x.o.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join('')}<div id="nx"></div></div>`;
 $.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b,x));
 const tb=document.getElementById('tb');
 T=setInterval(()=>{S.t-=.1;tb.style.width=Math.max(S.t,0)/15*100+'%';if(S.t<=5)tb.classList.add('lo');if(S.t<=0)pick(null,x)},100);
}
function pick(b,x){
 clearInterval(T);
 const ok=!!b&&x.o[b.dataset.j]===x.a,c=document.getElementById('qc');
 $.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(x.o[o.dataset.j]===x.a)o.classList.add('ok')});
 let m;
 if(ok){S.sc++;S.st++;const g=10+Math.min(S.st,5)*2+Math.ceil(S.t);S.pts+=g;m=`✅ Correct! +${g} pts${S.st>2?' 🔥 streak x'+S.st:''}`}
 else{S.st=0;S.miss.push(x);if(b)b.classList.add('no');c.classList.remove('pop');void c.offsetWidth;c.classList.add('shake');m=b?'❌ Not quite, the right answer is highlighted.':'⏰ Time is up!'}
 const last=S.i==S.qs.length-1;
 document.getElementById('nx').innerHTML=`<p class="fb">${m}</p><button class="pri" id="n">${last?'See results 🎉':'Next →'}</button>`;
 document.getElementById('n').onclick=()=>{S.i++;last?end():show()};
}
function end(){
 const b=+best(S.k)||0,nb=S.sc>b;if(nb)best(S.k,S.sc);
 const em=S.sc>=8?'🏆':S.sc>=5?'💪':'📚';
 $.innerHTML=`<div class="card pop" style="text-align:center"><div style="font-size:3rem">${em}</div><div class="big">${S.sc}/${S.qs.length}</div><p><span class="chip">⭐ ${S.pts} pts</span> ${nb&&S.sc?'<span class="chip">🆕 New best!</span>':''}</p><p>${S.sc>=8?'Interview ready!':S.sc>=5?'Solid, keep revising.':'Review and go again.'}</p>
 <button class="pri" id="r">Play again</button> <button class="pri" id="lbb" style="background:linear-gradient(135deg,#f59e0b,#ec4899)">🏆 Leaderboard</button> <button class="pri" id="h" style="background:var(--mu)">Home</button></div>
 ${S.miss.length?`<div class="card pop"><b>📝 Review mistakes</b><ul>${S.miss.map(m=>`<li>${esc(m.q)}<br><small>✔ ${esc(m.a)}</small></li>`).join('')}</ul></div>`:''}`;
 document.getElementById('r').onclick=()=>start(S.k);document.getElementById('h').onclick=home;document.getElementById('lbb').onclick=lbShow;lbSave();
 if(S.sc>=8)confetti();
}
function confetti(){const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:9';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const g=c.getContext('2d'),P=Array.from({length:150},()=>({x:Math.random()*c.width,y:-Math.random()*c.height/2,v:2+Math.random()*4,r:4+Math.random()*5,h:Math.random()*360,s:Math.random()*2-1}));let f=0;(function a(){g.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=p.s;g.fillStyle=`hsl(${p.h},90%,60%)`;g.fillRect(p.x,p.y,p.r,p.r*1.6)});++f<260?requestAnimationFrame(a):c.remove()})()}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c])}
home();
</script></body></html>
